services:
  imagecb:
    build:
      context: .
      args:
        APP_BUILD_ID: ${APP_BUILD_ID:-development}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./corpus:/corpus:ro
    environment:
      DATA_DIR: /app/data
      CHROMA_DIR: /app/data/chroma
      SQLITE_PATH: /app/data/imagecb.db
      IMAGE_CACHE_DIR: /app/data/images
      UPLOADS_DIR: /app/data/uploads
      BM25_PATH: /app/data/bm25.pkl
      HUBNESS_PATH: /app/data/hubness.pkl
      DECK_CACHE_DIR: /app/data/deck_cache
      ACRONYM_CACHE_PATH: /app/data/acronym_cache.json
      TESSERACT_CMD: /usr/bin/tesseract
      BOOTSTRAP_CORPUS_DIR: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
