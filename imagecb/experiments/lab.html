<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipeline Lab — Imagecb</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1e222b;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --accent: #5b8cff;
        --accent-soft: #21314f;
        --good: #2ecc71;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 { margin: 0; font-size: 17px; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        flex-wrap: wrap;
      }
      .controls input[type="text"] {
        flex: 1 1 360px;
        min-width: 240px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .controls input[type="text"]:focus { outline: none; border-color: var(--accent); }
      .topk { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      .topk input { width: 130px; }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .parsed {
        padding: 8px 20px;
        color: var(--muted);
        font-size: 12px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        min-height: 18px;
      }
      .parsed code { color: var(--text); }
      .board {
        flex: 1;
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 14px;
        align-items: stretch;
      }
      .column {
        flex: 0 0 300px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .col-head {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
      }
      .col-head .name { font-weight: 700; font-size: 13px; }
      .col-head .desc { color: var(--muted); font-size: 11px; margin-top: 3px; }
      .col-head .badge {
        display: inline-block;
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .col-body { padding: 10px; overflow-y: auto; flex: 1; }
      .card {
        display: flex;
        gap: 10px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        background: var(--panel-2);
      }
      .card .rank {
        color: var(--muted);
        font-size: 11px;
        width: 18px;
        text-align: right;
        flex: 0 0 18px;
      }
      .card img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 6px;
        background: #000;
        flex: 0 0 64px;
      }
      .card .noimg {
        width: 64px; height: 64px; border-radius: 6px;
        background: #000; color: var(--muted);
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; flex: 0 0 64px; text-align: center;
      }
      .card .meta { min-width: 0; flex: 1; }
      .card .pct {
        font-weight: 700;
        color: var(--good);
        font-size: 12px;
      }
      .card .title {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .prov {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .cap {
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .state { color: var(--muted); font-size: 12px; padding: 8px 4px; }
      .err { color: #ff7676; font-size: 12px; padding: 8px 4px; }
      .spinner {
        display: inline-block;
        width: 12px; height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: -2px;
        margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header>
      <h1>Pipeline Lab</h1>
      <p>Compare query-time ranking pipelines for a single text query against the current index. Experimental &amp; isolated.</p>
    </header>

    <div class="controls">
      <input
        type="text"
        id="query"
        placeholder='e.g. "dashboard screenshots from Q3"'
        autofocus
      />
      <label class="topk">
        Top-K
        <input type="range" id="topk" min="1" max="20" value="8" />
        <span id="topk-val">8</span>
      </label>
      <button id="run">Compare</button>
    </div>

    <div class="parsed" id="parsed"></div>

    <div class="board" id="board"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const board = $("board");
      const parsed = $("parsed");
      const topk = $("topk");
      const topkVal = $("topk-val");
      const runBtn = $("run");
      const queryInput = $("query");

      const columns = {};

      topk.addEventListener("input", () => (topkVal.textContent = topk.value));

      function escapeHtml(s) {
        return String(s || "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function makeColumn(v) {
        const col = document.createElement("div");
        col.className = "column";
        col.innerHTML = `
          <div class="col-head">
            <div class="name">${escapeHtml(v.label)}</div>
            <div class="desc">${escapeHtml(v.description)}</div>
            <div class="badge" data-badge><span class="spinner"></span>waiting…</div>
          </div>
          <div class="col-body" data-body>
            <div class="state">Queued.</div>
          </div>`;
        board.appendChild(col);
        columns[v.key] = col;
      }

      function renderVariant(entry) {
        const col = columns[entry.key];
        if (!col) return;
        const badge = col.querySelector("[data-badge]");
        const body = col.querySelector("[data-body]");
        if (entry.error) {
          badge.innerHTML = "error";
          body.innerHTML = `<div class="err">${escapeHtml(entry.error)}</div>`;
          return;
        }
        badge.textContent = `${entry.count} result${entry.count === 1 ? "" : "s"}`;
        if (!entry.results.length) {
          body.innerHTML = `<div class="state">No results.</div>`;
          return;
        }
        body.innerHTML = entry.results
          .map((r) => {
            const img = r.has_image_file
              ? `<img loading="lazy" src="${escapeHtml(r.thumb_url || r.image_url)}" alt="" />`
              : `<div class="noimg">no image</div>`;
            return `
              <div class="card">
                <div class="rank">${r.rank}</div>
                ${img}
                <div class="meta">
                  <div class="pct">${r.match_percent}%</div>
                  <div class="title" title="${escapeHtml(r.image_name)}">${escapeHtml(r.image_name)}</div>
                  <div class="prov" title="${escapeHtml(r.provenance)}">${escapeHtml(r.provenance)}</div>
                  <div class="cap">${escapeHtml(r.caption)}</div>
                </div>
              </div>`;
          })
          .join("");
      }

      function setAllPending() {
        Object.values(columns).forEach((col) => {
          col.querySelector("[data-badge]").innerHTML =
            '<span class="spinner"></span>running…';
        });
      }

      async function run() {
        const query = queryInput.value.trim();
        if (!query) {
          queryInput.focus();
          return;
        }
        runBtn.disabled = true;
        runBtn.textContent = "Running…";
        board.innerHTML = "";
        parsed.textContent = "";
        for (const k of Object.keys(columns)) delete columns[k];

        try {
          const res = await fetch("/api/lab/compare/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, top_k: Number(topk.value) }),
          });
          if (!res.ok || !res.body) {
            throw new Error("Request failed: " + res.status);
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() || "";
            for (const part of parts) {
              const line = part.split("\n").find((l) => l.startsWith("data: "));
              if (!line) continue;
              handleEvent(JSON.parse(line.slice(6)));
            }
          }
        } catch (err) {
          parsed.innerHTML = `<span class="err">${escapeHtml(err.message)}</span>`;
        } finally {
          runBtn.disabled = false;
          runBtn.textContent = "Compare";
        }
      }

      function handleEvent(ev) {
        if (ev.type === "meta") {
          const pq = ev.parsed_query || {};
          const bits = [];
          if (pq.semantic_query) bits.push(`semantic: <code>${escapeHtml(pq.semantic_query)}</code>`);
          if (pq.must_have_keywords && pq.must_have_keywords.length)
            bits.push(`must-have: <code>${escapeHtml(pq.must_have_keywords.join(", "))}</code>`);
          if (pq.must_avoid_keywords && pq.must_avoid_keywords.length)
            bits.push(`must-avoid: <code>${escapeHtml(pq.must_avoid_keywords.join(", "))}</code>`);
          bits.push(`candidates: <code>${ev.candidate_count}</code>`);
          parsed.innerHTML = bits.join(" &nbsp;•&nbsp; ");
          ev.variants.forEach(makeColumn);
          setAllPending();
        } else if (ev.type === "variant") {
          renderVariant(ev.variant);
        } else if (ev.type === "error") {
          parsed.innerHTML = `<span class="err">${escapeHtml(ev.detail)}</span>`;
        }
      }

      runBtn.addEventListener("click", run);
      queryInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") run();
      });
    </script>
  </body>
</html>
